; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lolin_d32_pro]
platform = espressif32
board = lolin_d32_pro
framework = arduino
; HttpClient's b64.cpp is missing a return
; https://github.com/amcewen/HttpClient/issues/47
build_unflags = -Werror=return-type
build_src_flags = -Wall -Wextra
build_flags =
    -DCFG_WIFI_SSID='"${sysenv.WIFI_SSID}"'
    -DCFG_WIFI_PASSWORD='"${sysenv.WIFI_PASSWORD}"'
    -DCFG_BACKEND_HOST='"${sysenv.BACKEND_HOST}"'
    -DCFG_BACKEND_TOKEN='"${sysenv.BACKEND_TOKEN}"'
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.0
    amcewen/HttpClient@^2.2.0
    Arduino_JSON@0.1.0
    WiFi@^2.0.0
    zinggjm/GxEPD2@^1.6.3
